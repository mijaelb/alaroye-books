<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Alaroye Administratie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a binder (ordner). Each register sits behind a coloured divider tab, the way paper books are filed:
   blue = VAT, red = corrections, green = sales, amber = purchases, violet = assets/profit, grey = method.
   White sheets on a pale grey desk; heavy grotesk for headings, accountant's double rule under totals. */
:root {
  --desk: #e9ebee; --sheet: #ffffff; --ink: #111317; --muted: #5d6470; --faint: #8b929e; --rule: #d9dce2; --hair: #eef0f3;
  --blue: #2445c7; --red: #c4382f; --green: #0d8058; --amber: #c27c00; --violet: #6b3fb3; --grey: #5d6470;
  --blue-t: #e8ecfb; --red-t: #fbe9e7; --green-t: #e2f3ec; --amber-t: #faf0dc; --violet-t: #efe8f9; --grey-t: #eceef1;
  --display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body: "Instrument Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "DM Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --desk: #0c0e12; --sheet: #15181e; --ink: #eceef2; --muted: #9aa1ad; --faint: #6b7280; --rule: #2a2f39; --hair: #1e222a;
  --blue: #8aa2ff; --red: #ff8b80; --green: #5fd3a4; --amber: #f2bd55; --violet: #bf9cff; --grey: #a3aab6;
  --blue-t: #1a2246; --red-t: #3a1d1b; --green-t: #12301f; --amber-t: #352812; --violet-t: #2a1f44; --grey-t: #22262e;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --desk: #0c0e12; --sheet: #15181e; --ink: #eceef2; --muted: #9aa1ad; --faint: #6b7280; --rule: #2a2f39; --hair: #1e222a;
  --blue: #8aa2ff; --red: #ff8b80; --green: #5fd3a4; --amber: #f2bd55; --violet: #bf9cff; --grey: #a3aab6;
  --blue-t: #1a2246; --red-t: #3a1d1b; --green-t: #12301f; --amber-t: #352812; --violet-t: #2a1f44; --grey-t: #22262e;
  color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
body { margin: 0; background: var(--desk); color: var(--ink); font: 400 15px/1.55 var(--body); font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
a { color: var(--c, var(--blue)); text-decoration-thickness: 1px; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--c, var(--blue)); outline-offset: 2px; }
h1, h2 { font-family: var(--display); margin: 0; text-wrap: balance; }
h3 { font-size: 0.95rem; font-weight: 600; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.r { text-align: right; white-space: nowrap; }
td.d { white-space: nowrap; font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 0.84em; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1200px; margin: 0 auto; }
[data-c="blue"] { --c: var(--blue); --t: var(--blue-t); } [data-c="red"] { --c: var(--red); --t: var(--red-t); }
[data-c="green"] { --c: var(--green); --t: var(--green-t); } [data-c="amber"] { --c: var(--amber); --t: var(--amber-t); }
[data-c="violet"] { --c: var(--violet); --t: var(--violet-t); } [data-c="grey"] { --c: var(--grey); --t: var(--grey-t); }

/* ---------- lock screen */
#lock { min-height: 100vh; display: grid; place-items: center; padding-block: 40px; }
#lock form { width: min(420px, 100%); display: grid; gap: 16px; background: var(--sheet); padding: 34px 30px 30px; border-radius: 4px;
  box-shadow: 0 1px 0 var(--rule), 0 18px 40px -24px rgba(0,0,0,.35); border-top: 8px solid var(--blue); }
#lock h1 { font-size: 2.8rem; font-weight: 800; line-height: .95; letter-spacing: -0.03em; }
#lock .kick { font: 500 0.78rem var(--mono); color: var(--muted); }
#lock .row { display: flex; gap: 8px; }
#lock input { flex: 1; min-width: 0; font: inherit; padding: 11px 12px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); border-radius: 3px; }
button.primary { font: 600 0.92rem var(--body); padding: 11px 20px; border: 0; border-radius: 3px; background: var(--ink); color: var(--sheet); cursor: pointer; }
#lock-err { color: var(--muted); font-size: 0.88rem; min-height: 1.4em; }
#lock-err.bad { color: var(--red); }

/* ---------- binder tabs */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--desk); }
.tabs .wrap { display: flex; align-items: flex-end; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-top: 10px; }
.tabs .mark { font: 800 1.15rem/1 var(--display); letter-spacing: -0.02em; margin-right: 14px; padding-bottom: 10px; white-space: nowrap; }
.tabs .mark span { font: 500 0.75rem var(--mono); color: var(--muted); letter-spacing: 0; margin-left: 6px; }
#toc { display: flex; gap: 4px; margin: 0; padding: 0; list-style: none; }
#toc a { display: block; padding: 7px 13px 8px; border-radius: 6px 6px 0 0; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 0.84rem;
  background: var(--t); border-top: 3px solid var(--c); white-space: nowrap; transition: transform .15s, color .15s; transform: translateY(3px); }
#toc a:hover { color: var(--ink); transform: translateY(0); }
#toc a.on { background: var(--sheet); color: var(--ink); transform: translateY(0); }
.tabs .stamp { margin-left: auto; padding: 0 0 10px 16px; font: 400 0.75rem var(--mono); color: var(--faint); white-space: nowrap; }

/* ---------- sheets */
main { padding-block: 0 80px; }
main .wrap { display: grid; gap: 18px; }
.sheet { background: var(--sheet); border-radius: 0 0 4px 4px; padding: 40px clamp(18px, 4vw, 52px) 44px; display: grid; gap: 24px; min-width: 0;
  border-top: 4px solid var(--c, var(--ink)); scroll-margin-top: 54px; }
.sheet > header { display: grid; grid-template-columns: auto 1fr; gap: 4px 20px; align-items: end; }
.sheet > header .no { grid-row: span 2; font: 800 clamp(3rem, 6vw, 4.4rem)/0.8 var(--display); color: var(--c); letter-spacing: -0.04em; }
.sheet > header .kick { font: 500 0.78rem var(--mono); color: var(--c); }
.sheet > header h2 { font-size: clamp(1.5rem, 2.6vw, 2rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
.sheet > header p { grid-column: 1 / -1; color: var(--muted); max-width: 68ch; margin-top: 10px; }

/* title sheet */
.cover { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 40px; align-items: end; }
.cover h1 { font-size: clamp(3.4rem, 10vw, 7.5rem); font-weight: 800; line-height: .82; letter-spacing: -0.05em; }
.cover h1 small { display: block; font: 500 clamp(1rem, 2vw, 1.25rem)/1.3 var(--body); letter-spacing: 0; color: var(--muted); margin-top: 18px; }
.cover .intro { margin-top: 18px; max-width: 54ch; }
dl.ids { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin: 0; border-top: 2px solid var(--ink); }
dl.ids div { padding: 9px 0; border-bottom: 1px solid var(--hair); min-width: 0; }
dl.ids div:nth-child(odd) { padding-right: 12px; }
dl.ids dt { font: 500 0.72rem var(--mono); color: var(--muted); }
dl.ids dd { margin: 1px 0 0; font-weight: 500; overflow-wrap: anywhere; }
.figures { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.figures div { background: var(--t); border-radius: 4px; padding: 16px 18px 18px; display: grid; gap: 8px; align-content: space-between; min-height: 116px; }
.figures .v { font: 700 clamp(1.6rem, 3vw, 2.2rem)/1 var(--display); letter-spacing: -0.03em; color: var(--c); }
.figures .k { font-size: 0.83rem; color: var(--ink); }

/* tables */
.tbl { overflow-x: auto; min-width: 0; }
table { border-collapse: collapse; width: 100%; font-size: 0.87rem; }
th, td { padding: 9px 12px 9px 0; border-bottom: 1px solid var(--hair); text-align: left; vertical-align: top; }
th:last-child, td:last-child { padding-right: 0; }
thead th { font: 500 0.72rem var(--mono); color: var(--muted); border-bottom: 2px solid var(--ink); white-space: nowrap; padding-bottom: 7px; }
tbody tr:hover td { background: var(--t, var(--hair)); }
tfoot td { font-weight: 600; border-bottom: 0; }
tfoot tr:first-child td { border-top: 2px solid var(--ink); }
td.total { border-bottom: 3px double var(--ink); }
tr.off td { color: var(--faint); }
tr.off .who { text-decoration: line-through; text-decoration-color: var(--rule); }
.sub { display: block; font-size: 0.78rem; color: var(--muted); margin-top: 3px; max-width: 44ch; line-height: 1.45; }
tr.off .sub { color: var(--faint); }
.who { font-weight: 600; }

.form th[scope="row"] { font: 500 0.95rem var(--mono); color: var(--c); width: 3em; }
.form td.lbl { color: var(--muted); }
.form tr.sum th, .form tr.sum td { border-top: 2px solid var(--ink); }
.form tr.pay th, .form tr.pay td { font-weight: 700; }
.form tr.pay td.r { border-bottom: 3px double var(--ink); font-size: 1rem; }
.form tr.meta td, .form tr.meta th { color: var(--muted); font-size: 0.82rem; border-bottom-color: transparent; padding-block: 4px; }

.tag { display: inline-block; padding: 1px 7px; border-radius: 3px; font: 500 0.72rem var(--mono); white-space: nowrap; background: var(--hair); color: var(--muted); }
.tag.box { background: var(--blue-t); color: var(--blue); }
.tag.good { background: var(--green-t); color: var(--green); }
.tag.warn { background: var(--amber-t); color: var(--amber); }
.tag.bad { background: var(--red-t); color: var(--red); }
a.doc, button.doc { font: 600 0.78rem var(--body); color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 3px; padding: 3px 9px; cursor: pointer; text-decoration: none; white-space: nowrap; }
a.doc:hover, button.doc:hover { border-color: var(--ink); }

.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.note { background: var(--t); border-radius: 4px; padding: 14px 16px; display: grid; gap: 6px; align-content: start; }
.note b { font: 700 1.1rem var(--display); color: var(--c); }
.note ul { margin: 0; padding-left: 1.05em; display: grid; gap: 5px; font-size: 0.88rem; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 40px; }
.two > div { min-width: 0; display: grid; gap: 12px; align-content: start; }

.filters { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.seg { display: inline-flex; background: var(--hair); border-radius: 4px; padding: 3px; gap: 2px; }
.seg button { font: 600 0.82rem var(--body); border: 0; background: none; color: var(--muted); padding: 5px 11px; cursor: pointer; border-radius: 3px; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--sheet); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.filters select, .filters input { font: inherit; font-size: 0.86rem; padding: 7px 10px; border: 1px solid var(--rule); border-radius: 4px; background: var(--sheet); color: var(--ink); min-width: 0; }
.filters input { width: min(300px, 100%); }
.count { font: 400 0.78rem var(--mono); color: var(--muted); margin-left: auto; }
button.more { justify-self: start; font: 600 0.86rem var(--body); background: var(--t); border: 0; border-radius: 4px; padding: 9px 16px; color: var(--c); cursor: pointer; }

dl.policy { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 22px 36px; margin: 0; }
dl.policy dt { font: 700 1.05rem var(--display); letter-spacing: -0.01em; }
dl.policy dd { margin: 4px 0 0; color: var(--muted); font-size: 0.92rem; }
footer { font: 400 0.75rem var(--mono); color: var(--faint); padding-top: 8px; }

/* document viewer */
dialog#viewer { width: min(940px, 100vw); height: 100vh; max-height: none; max-width: none; margin: 0 0 0 auto; padding: 0; border: 0; background: var(--sheet); color: var(--ink); }
dialog#viewer::backdrop { background: rgba(8, 10, 14, 0.5); }
dialog#viewer[open] { display: grid; grid-template-rows: auto 1fr; }
.vbar { display: flex; gap: 8px; align-items: center; padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 12px 18px; border-bottom: 2px solid var(--ink); }
.vbar .t { flex: 1; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vbody { min-height: 0; background: var(--desk); display: grid; place-items: center; overflow: auto; }
.vbody iframe { width: 100%; height: 100%; border: 0; background: #fff; }
.vbody img { max-width: 100%; max-height: 100%; object-fit: contain; }

@media (max-width: 860px) {
  .cover { grid-template-columns: minmax(0, 1fr); gap: 28px; }
  .figures { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tabs .stamp { display: none; }
}
@media (max-width: 460px) { dl.ids { grid-template-columns: 1fr; } dl.ids div:nth-child(odd) { padding-right: 0; } }
</style>
</head>
<body>

<div id="lock" class="gutter" hidden>
  <form id="lock-form" autocomplete="off">
    <span class="kick">administratie · encrypted</span>
    <h1 id="lock-name">Alaroye</h1>
    <p class="muted">These books and every invoice are encrypted. Enter the password you received to open them.</p>
    <div class="row">
      <input id="lock-pw" type="password" aria-label="Password" placeholder="Password" required>
      <button class="primary" type="submit" id="lock-btn">Open</button>
    </div>
    <p id="lock-err" role="alert"></p>
  </form>
</div>

<div id="app" hidden></div>

<dialog id="viewer" aria-labelledby="v-title">
  <div class="vbar">
    <span class="t" id="v-title"></span>
    <a class="doc" id="v-open" target="_blank" rel="noopener">Open in new tab</a>
    <a class="doc" id="v-dl">Download</a>
    <button class="doc" type="button" id="v-close">Close</button>
  </div>
  <div class="vbody" id="v-body"></div>
</dialog>

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const eur = (n, dec = 2) => (n === "" || n == null || isNaN(+n)) ? "" :
  "€ " + (+n).toLocaleString("nl-NL", { minimumFractionDigits: dec, maximumFractionDigits: dec });
const fmtDate = (d) => d ? d.split("-").reverse().join("-") : "";
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
let KEY = null;

// ---------- encrypted mode: AES-256-GCM, key = PBKDF2-SHA256(password)
async function deriveKey(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(RAW.enc.salt), iterations: RAW.enc.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function decrypt(buf) {  // 12-byte IV, then ciphertext + tag
  return crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, KEY, buf.slice(12));
}
async function unlock(key) {
  KEY = key;
  const plain = await decrypt(b64(RAW.enc.data).buffer);
  return JSON.parse(new TextDecoder().decode(plain));
}
async function boot() {
  if (!RAW.enc) return render(RAW);
  try {
    const saved = sessionStorage.getItem("books-key");
    if (saved) return render(await unlock(await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", true, ["decrypt"])));
  } catch (e) { /* no saved key, or storage blocked */ }
  $("#lock").hidden = false;
  $("#lock-pw").focus();
  $("#lock-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("#lock-btn").disabled = true; $("#lock-err").className = ""; $("#lock-err").textContent = "Opening…";
    try {
      const data = await unlock(await deriveKey($("#lock-pw").value));
      try {
        const raw = new Uint8Array(await crypto.subtle.exportKey("raw", KEY));
        sessionStorage.setItem("books-key", btoa(String.fromCharCode(...raw)));
      } catch (e) { /* storage blocked: ask again next time */ }
      $("#lock").hidden = true; $("#lock-err").textContent = ""; render(data);
    } catch (err) {
      $("#lock-err").className = "bad"; $("#lock-err").textContent = "That password doesn't open these books. Check it and try again.";
    } finally { $("#lock-btn").disabled = false; }
  });
}

// ---------- document links and viewer
function docLink(f, title) {
  if (!f) return '<span class="tag warn">no file</span>';
  if (f.startsWith("#")) return `<a class="doc" href="${esc(f)}">Corrections</a>`;
  if (f.startsWith("http")) return `<a class="doc" href="${esc(f)}" target="_blank" rel="noopener">Drive</a>`;
  if (f.startsWith("enc:")) return `<button class="doc" type="button" data-doc="${esc(f)}" data-title="${esc(title)}">View</button>`;
  return `<a class="doc" href="${esc(f)}" target="_blank" rel="noopener">View</a>`;
}
let blobUrl = null;
document.addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-doc]");
  if (!b) return;
  const [, id, type, name] = b.dataset.doc.split(":");
  const v = $("#viewer"), body = $("#v-body");
  $("#v-title").textContent = b.dataset.title;
  body.innerHTML = '<span class="muted">Decrypting…</span>';
  $("#v-open").hidden = $("#v-dl").hidden = true;
  v.showModal();
  try {
    const res = await fetch(`f/${id}.bin`);
    if (!res.ok) throw new Error(res.status);
    const blob = new Blob([await decrypt(await res.arrayBuffer())], { type });
    if (blobUrl) URL.revokeObjectURL(blobUrl);
    blobUrl = URL.createObjectURL(blob);
    body.innerHTML = type.startsWith("image/") ? `<img alt="${esc(b.dataset.title)}" src="${blobUrl}">` : `<iframe title="${esc(b.dataset.title)}" src="${blobUrl}"></iframe>`;
    $("#v-open").href = blobUrl; $("#v-dl").href = blobUrl; $("#v-dl").download = decodeURIComponent(name);
    $("#v-open").hidden = $("#v-dl").hidden = false;
  } catch (err) {
    body.innerHTML = '<span class="muted">This document could not be opened. Reload the page and try again.</span>';
  }
});
$("#v-close").addEventListener("click", () => $("#viewer").close());
$("#viewer").addEventListener("click", (e) => { if (e.target.id === "viewer") e.currentTarget.close(); });

function render(D) {
  if (D.app_html) $("#app").innerHTML = D.app_html;  // encrypted build: the page body travels inside the ciphertext
  const Y = D.year, P = D.profile;
  document.title = `${P.name.split(" (")[0]} Administratie ${Y}`;
  $("#app").hidden = false;
  const short = P.name.split(" (")[0];
  $("#mark").innerHTML = `${esc(short)}<span>${Y}</span>`;
  $("#title").innerHTML = `${esc(short)}<small>Administratie ${Y} · boeken, btw-aangiften en facturen</small>`;
  $("#stamp").textContent = `Snapshot ${fmtDate(D.generated)}`;
  $("#intro").textContent = `Books, VAT returns and the underlying invoices of ${P.name}, prepared for review by the Belastingdienst. Every figure comes from the ledgers, and every ledger row opens its invoice.`;
  const bank = (P.banks || []).find((b) => b.use === "business");
  const ids = [["Legal form", "Eenmanszaak"], ["KvK", P.kvk], ["Btw-id", P.btw_id], ["Address", P.address],
    ["Business account", bank ? bank.iban : ""], ["VAT filing", P.kor ? "KOR" : "Quarterly, not on the KOR"], ["Contact", P.email]];
  $("#ids").innerHTML = ids.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("");
  $("#doc-policy").textContent = RAW.enc
    ? "“View” decrypts the copy kept with these books. “Drive” opens the original in the administration's Google Drive; access is given on request."
    : "“View” opens the copy kept with these books. “Drive” opens the original in the administration's Google Drive; access is given on request.";

  // figures
  const rev = Object.values(D.pnl.revenue).reduce((a, b) => a + +b, 0);
  const R = D.returns;
  const vatDue = R.filter((r) => r.status !== "running").reduce((a, r) => a + r.total, 0);
  const isOn = (p) => p.status === "ok" || p.status === "confirm";
  const counted = D.purchases.filter(isOn);
  const withFile = counted.filter((p) => p.file).length;
  const own = D.sales.filter((s) => !s.no.startsWith("WOO") && !s.no.startsWith("CORR"));
  $("#figures").innerHTML = [
    [eur(rev, 0), `Revenue excl. VAT, ${Y} to date`],
    [eur(vatDue, 0), "Net VAT, Q1 to Q3"],
    [String(own.length), "Own sales invoices, plus monthly shop totals"],
    [String(counted.length), `Purchase invoices counted, ${Math.round(100 * withFile / counted.length)}% with document`],
  ].map(([v, k], i) => `<div data-c="${["green", "blue", "green", "amber"][i]}"><span class="v">${esc(v)}</span><span class="k">${esc(k)}</span></div>`).join("");

  // returns
  const boxes = ["1a", "1b", "1c", "1e", "2a", "3a", "3b", "4a", "4b"].filter((b) => R.some((r) => r.boxes[b]));
  const stat = { filed: '<span class="tag good">filed</span>', prepared: '<span class="tag warn">to file</span>', running: '<span class="tag">running</span>' };
  let h = `<thead><tr><th>Rubriek</th><th></th>${R.map((r) => `<th class="r">${r.q}</th>`).join("")}</tr></thead><tbody>`;
  for (const b of boxes) {
    h += `<tr><th scope="row">${b}</th><td class="lbl">${esc(BOX[b])}</td>` + R.map((r) => { const v = r.boxes[b];
      return `<td class="r">${v ? eur(v[0], 0) + (v[1] ? `<span class="sub">btw ${eur(v[1], 0)}</span>` : "") : '<span class="muted">–</span>'}</td>`; }).join("") + "</tr>";
  }
  h += `<tr class="sum"><th scope="row">5a</th><td class="lbl">Verschuldigde omzetbelasting</td>${R.map((r) => `<td class="r">${eur(r["5a"], 0)}</td>`).join("")}</tr>`;
  h += `<tr><th scope="row">5b</th><td class="lbl">Voorbelasting</td>${R.map((r) => `<td class="r">${eur(r["5b"], 0)}</td>`).join("")}</tr>`;
  h += `<tr class="pay"><th scope="row">5g</th><td class="lbl">Te betalen</td>${R.map((r) => `<td class="r">${eur(r.total, 0)}</td>`).join("")}</tr>`;
  h += `<tr class="meta"><th scope="row"></th><td>Due</td>${R.map((r) => `<td class="r">${fmtDate(r.due)}</td>`).join("")}</tr>`;
  h += `<tr class="meta"><th scope="row"></th><td>Status</td>${R.map((r) => `<td class="r">${stat[r.status] || ""}</td>`).join("")}</tr></tbody>`;
  $("#returns-table").innerHTML = h;
  $("#remarks").innerHTML = R.filter((r) => r.remarks.length).map((r) =>
    `<div class="note"><b>${r.q}</b><ul>${r.remarks.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>`).join("");

  // corrections
  const C = D.correction || { causes: [], amount: 0 };
  $("#corr-causes").innerHTML = `<thead><tr><th>Cause</th><th>Detail</th></tr></thead><tbody>${C.causes.map(([a, b]) => `<tr><td class="who">${esc(a)}</td><td class="muted">${esc(b)}</td></tr>`).join("")}</tbody>
    <tfoot><tr><td>Net correction</td><td class="r total">${eur(C.amount)}</td></tr></tfoot>`;
  const icp = D.sales.filter((s) => s.box === "3b");
  $("#icp").innerHTML = `<thead><tr><th>Quarter</th><th>Customer</th><th>VAT id</th><th class="r">Amount</th></tr></thead><tbody>${
    icp.map((s) => `<tr><td>${s.ret}</td><td>${esc(s.customer)}</td><td class="mono">${esc(s.vat_id)}</td><td class="r">${eur(s.net)}</td></tr>`).join("") ||
    '<tr><td colspan="4" class="muted">No EU business-to-business services this year.</td></tr>'}</tbody>
    <tfoot><tr><td colspan="3">Total 3b</td><td class="r total">${eur(icp.reduce((a, s) => a + +s.net, 0))}</td></tr></tfoot>`;

  // sales
  const srows = D.sales.filter((s) => !s.no.startsWith("CORR"));
  let st = 0, sv = 0;
  $("#sales-table").innerHTML = `<thead><tr><th>Date</th><th>Invoice</th><th>Customer</th><th class="r">Net</th><th class="r">VAT</th><th>Rubriek</th><th>Return</th><th>Paid</th><th></th></tr></thead><tbody>${
    srows.map((s) => { st += +s.net; sv += +s.vat;
      const late = s.year !== Y || s.ret !== "Q" + (Math.floor((+s.date.slice(5, 7) - 1) / 3) + 1);
      const paid = s.paid ? fmtDate(s.paid) : /UNPAID/.test(s.note) ? '<span class="tag bad">unpaid</span>' : "";
      return `<tr><td class="d">${fmtDate(s.date)}</td><td class="mono">${esc(s.no || "–")}</td>
        <td><span class="who">${esc(s.customer)}</span> <span class="muted">${esc(s.country)}</span>${s.vat_id ? `<span class="sub mono">${esc(s.vat_id)}</span>` : ""}<span class="sub">${esc(s.note)}</span></td>
        <td class="r">${eur(s.net)}</td><td class="r">${+s.vat ? eur(s.vat) : ""}</td>
        <td>${s.box ? `<span class="tag box">${s.box}</span>` : ""}</td><td>${s.ret}${late ? ' <span class="tag warn">late</span>' : ""}</td>
        <td>${paid}</td><td class="r">${s.no.startsWith("WOO") ? '<span class="muted">shop export</span>' : docLink(s.file, `${s.no} ${s.customer}`)}</td></tr>`; }).join("")}</tbody>
    <tfoot><tr><td colspan="3">Total</td><td class="r total">${eur(st)}</td><td class="r total">${eur(sv)}</td><td colspan="4"></td></tr></tfoot>`;

  // purchases
  const F = { q: "", s: "counted", cat: "", text: "", limit: 60 };
  const seg = (el, key, opts) => {
    el.innerHTML = opts.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${F[key] === v}">${l}</button>`).join("");
    el.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; F[key] = b.dataset.v; F.limit = 60;
      el.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b)); renderP(); });
  };
  seg($("#f-q"), "q", [["", "Year"], ["Q1", "Q1"], ["Q2", "Q2"], ["Q3", "Q3"], ["Q4", "Q4"]]);
  seg($("#f-s"), "s", [["counted", "Counted"], ["off", "Not counted"], ["", "All"]]);
  $("#f-cat").innerHTML += [...new Set(D.purchases.map((p) => p.cat))].sort().map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
  $("#f-cat").addEventListener("change", (e) => { F.cat = e.target.value; F.limit = 60; renderP(); });
  $("#f-text").addEventListener("input", (e) => { F.text = e.target.value.toLowerCase(); F.limit = 60; renderP(); });
  $("#more").addEventListener("click", () => { F.limit = Infinity; renderP(); });
  const statusTag = (p) => isOn(p) ? `<span class="muted">${esc(p.paid_from)}</span>`
    : `<span class="tag ${p.status === "claimed_earlier" ? "" : p.status === "missing_invoice" ? "warn" : "bad"}">${esc(p.status_label)}</span>`;
  function renderP() {
    const rows = D.purchases.filter((p) => (!F.q || p.q === F.q) && (!F.cat || p.cat === F.cat) &&
      (F.s === "" || (F.s === "counted" ? isOn(p) : !isOn(p))) &&
      (!F.text || `${p.supplier} ${p.no} ${p.desc} ${p.note}`.toLowerCase().includes(F.text)));
    let g = 0, d = 0;
    rows.forEach((p) => { if (p.cur === "EUR") g += +p.gross; d += +p.ded; });
    const body = rows.slice(0, F.limit).map((p) => `<tr class="${isOn(p) ? "" : "off"}"><td class="d">${fmtDate(p.date)}</td>
      <td><span class="who">${esc(p.supplier)}</span> <span class="muted">${esc(p.country)}</span>${p.vat_id ? `<span class="sub mono">${esc(p.vat_id)}</span>` : ""}${p.no ? `<span class="sub mono">${esc(p.no)}</span>` : ""}</td>
      <td>${esc(p.desc)}${p.note ? `<span class="sub">${esc(p.note)}</span>` : ""}</td>
      <td title="${esc(D.categories[p.cat] || "")}">${esc(p.cat)}${p.pct !== "100" ? `<span class="sub">${p.pct}% business</span>` : ""}</td>
      <td class="r">${p.cur === "EUR" ? eur(p.gross) : esc(p.cur + " " + p.gross)}</td>
      <td class="r">${+p.vat ? eur(p.vat) : ""}${p.box ? ` <span class="tag box">${p.box}</span>` : ""}</td>
      <td class="r">${+p.ded ? eur(p.ded) : ""}</td>
      <td>${statusTag(p)}</td>
      <td class="r">${docLink(p.file, `${p.supplier} ${p.no || fmtDate(p.date)}`)}</td></tr>`).join("");
    $("#purch-table").innerHTML = `<thead><tr><th>Date</th><th>Supplier</th><th>Description</th><th>Category</th><th class="r">Gross</th><th class="r">VAT</th><th class="r">Deducted</th><th>Status</th><th></th></tr></thead>
      <tbody>${body || '<tr><td colspan="9" class="muted">No purchases match these filters.</td></tr>'}</tbody>
      <tfoot><tr><td colspan="4">${rows.length} rows</td><td class="r total">${eur(g)}</td><td></td><td class="r total">${eur(d)}</td><td colspan="2"></td></tr></tfoot>`;
    $("#f-count").textContent = `${rows.length} of ${D.purchases.length}`;
    $("#more").hidden = rows.length <= F.limit;
    $("#more").textContent = `Show all ${rows.length} rows`;
  }
  renderP();

  // assets
  $("#assets-table").innerHTML = `<thead><tr><th>Date</th><th>Asset</th><th class="r">Cost excl. VAT</th><th class="r">Depreciation ${Y}</th><th class="r">Book value 31-12</th></tr></thead><tbody>${
    D.assets.map((a) => `<tr><td class="d">${fmtDate(a.date)}</td><td><span class="who">${esc(a.desc)}</span><span class="sub">${esc(a.supplier)}</span></td><td class="r">${eur(a.cost)}</td><td class="r">${eur(a.dep)}</td><td class="r">${eur(a.cost - a.dep)}</td></tr>`).join("")}</tbody>
    <tfoot><tr><td colspan="2">Total</td>${["cost", "dep"].map((k) => `<td class="r total">${eur(D.assets.reduce((s, a) => s + +a[k], 0))}</td>`).join("")}<td class="r total">${eur(D.assets.reduce((s, a) => s + a.cost - a.dep, 0))}</td></tr></tfoot>`;
  $("#kia").textContent = D.kia.rate ? `Kleinschaligheidsinvesteringsaftrek: ${Math.round(D.kia.rate * 100)}% of ${eur(D.kia.base)}.`
    : `Qualifying investments ${eur(D.kia.base)}: below the KIA threshold, so no investment deduction so far.`;

  // profit
  const costRows = Object.entries(D.pnl.costs).filter(([, v]) => +v);
  const tc = costRows.reduce((a, [, v]) => a + +v, 0);
  $("#pnl-rev").innerHTML = `<thead><tr><th>Omzet</th><th class="r">Excl. VAT</th></tr></thead><tbody>${Object.entries(D.pnl.revenue).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="r">${eur(v)}</td></tr>`).join("")}</tbody>
    <tfoot><tr><td>Revenue</td><td class="r">${eur(rev)}</td></tr><tr><td class="muted">Costs</td><td class="r">${eur(-tc)}</td></tr><tr><td>Profit to date</td><td class="r total">${eur(rev - tc)}</td></tr></tfoot>`;
  $("#pnl-cost").innerHTML = `<thead><tr><th>Kosten</th><th class="r">Amount</th></tr></thead><tbody>${costRows.map(([k, v]) => `<tr><td>${esc(k)}<span class="sub">${esc(D.categories[k] || (k === "afschrijvingen" ? "Depreciation of assets" : ""))}</span></td><td class="r">${eur(v)}</td></tr>`).join("")}</tbody>
    <tfoot><tr><td>Total costs</td><td class="r total">${eur(tc)}</td></tr></tfoot>`;

  $("#foot").textContent = `Generated ${fmtDate(D.generated)} from the sales, purchase and bank ledgers of ${P.name}: ${D.sales.length} sales rows, ${D.purchases.length} purchase rows.`;

  // index highlight
  const links = [...document.querySelectorAll("#toc a")];
  const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting)
    links.forEach((a) => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id)); }), { rootMargin: "-20% 0px -70% 0px" });
  document.querySelectorAll("main .sheet").forEach((s) => io.observe(s));
}

boot();
</script>
</body>
</html>
